name: Reproduce analysis
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install analysis environment
        run: python -m pip install -r requirements.txt
      - name: Rebuild and validate all analysis stages
        run: python scripts/run_pipeline.py
      - name: Verify dashboard pages and aggregates
        run: python scripts/99_verify_dashboard_v2.py
      - name: Check documentation links
        run: python scripts/verify_docs.py
